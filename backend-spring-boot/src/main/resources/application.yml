server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: growwealth-investment-advisor-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Supports both Supabase Cloud PostgreSQL and Local PostgreSQL seamlessly
    # When connecting to Supabase, provide SUPABASE_DB_URL (or SPRING_DATASOURCE_URL)
    url: ${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/growwealth_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: GrowWealthHikariPool
      max-lifetime: 1800000
      connection-timeout: 20000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application-specific configurations
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtbG9uZy1zZWNyZXQta2V5LWZvci1ncm93d2VhbHRoLWp3dC1hdXRoIQ==}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 2592000000 # 30 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,https://growwealth.in,*}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: false
    max-age: 3600

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
