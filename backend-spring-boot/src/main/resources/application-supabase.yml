# Spring Boot Configuration for Supabase Managed PostgreSQL
spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    # Supabase provides both Direct Connection (port 5432) and Connection Pooler (port 6543 / 5432)
    # Direct format: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
    # Pooler format: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.${SUPABASE_PROJECT_REF:your-project-ref}.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep pool size moderate for Supabase free-tier connection limits
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 30000
      pool-name: SupabaseHikariPool
      max-lifetime: 1800000
      connection-timeout: 20000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Validates that Hibernate entity mappings match the Supabase PostgreSQL tables
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    # Flyway manages database schema migrations in Supabase automatically on startup
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.growwealth.advisor: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
